name: Android Build

# VutronMusic Android (Capacitor) 构建工作流
# 在 x86_64 runner 上构建 debug APK（ARM64 主机无法跑 aapt2 等 x86_64 原生工具）

on:
  push:
    branches:
      - main
      - 'feat/android**'
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'vite.config.mobile.ts'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'vite.config.mobile.ts'
  workflow_dispatch: # 手动触发

jobs:
  build-apk:
    runs-on: ubuntu-latest # x86_64
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK 34 + build-tools 34.0.0 + cmdline-tools
      # 无需 android-actions/setup-android（v3 与 cmdline-tools 16.0 不兼容）
      - name: Accept Android SDK licenses & verify
        run: |
          # 找到 sdkmanager（可能是 latest 或版本号目录）
          SDKMGR=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "API levels:" && ls $ANDROID_HOME/platforms/ 2>/dev/null
          echo "Build tools:" && ls $ANDROID_HOME/build-tools/ 2>/dev/null

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: yarn install --ignore-scripts --ignore-engines --network-timeout 600000

      - name: Build mobile web assets
        run: yarn mobile:build

      - name: Verify index.html
        run: |
          test -f dist-mobile/index.html || (echo "dist-mobile/index.html missing" && exit 1)
          echo "✓ dist-mobile/index.html exists"

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vutronmusic-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "## Android Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✅ APK 构建成功" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "下载 artifact \`vutronmusic-android-debug\` 获取 APK，用 \`adb install\` 安装到设备。" >> $GITHUB_STEP_SUMMARY
            ls -lh android/app/build/outputs/apk/debug/*.apk >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ APK 构建失败，查看上方日志" >> $GITHUB_STEP_SUMMARY
          fi
